<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <script>
        function validarFormulario() {
            // Obter os valores dos campos A e B
            var campoA = parseFloat(document.getElementById("campoA").value);
            var campoB = parseFloat(document.getElementById("campoB").value);

            // Verificar se o campo B é maior que o campo A
            if (campoB > campoA) {
                // Exibir mensagem positiva
                alert("Formulário válido! O número B é maior que o número A.");
                return true;  // Formulário é válido
            } else {
                // Exibir mensagem negativa
                alert("Formulário inválido! O número B deve ser maior que o número A.");
                return false;  // Formulário não é válido
            }
        }
    </script>
</head>

<body>
    <h1>Formulário de Validação</h1>

    <form onsubmit="return validarFormulario()">
        <label for="campoA">Campo A (Número):</label>
        <input type="number" id="campoA" required><br><br>

        <label for="campoB">Campo B (Número):</label>
        <input type="number" id="campoB" required><br><br>

        <button type="submit">Submeter</button>
    </form>
</body>

</html>
